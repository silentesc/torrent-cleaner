[package]
name = "torrent-cleaner"
version = "3.0.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["cookies", "json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
walkdir = "2.5.0"
rusqlite = { version = "0.40.1", features = ["chrono"] }
